[versions]
agp = "9.5.0"
activity-compose = "1.13.0"
core-splashscreen = "1.2.0"
androidx-navigationevent = "1.2.0"
kotlin = "2.4.21"
coroutines = "1.11.0"
coil = "3.6.3"
okhttp = "5.5.1"
serialization = "1.12.0"
junit = "4.13.2"
miuix = "0.9.4"
miuix-nav = "0.9.4"
opencc4j = "1.14.0"
webp-imageio = "0.11.0"

[libraries]
# 与 Matter 使用同一版光学渲染器和连续曲率形状，避免同参数在不同 shader 上产生不同效果。
backdrop = { group = "io.github.kyant0", name = "backdrop", version = "2.0.1" }
shapes = { group = "io.github.kyant0", name = "shapes", version = "1.2.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose-android", version.ref = "androidx-navigationevent" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Coil 3 不再内置网络加载器，取图必须显式装一个 fetcher；用 okhttp 版是为了与 core 复用同一套连接池与拦截器。
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
miuix-icons-android = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
miuix-nav-android = { group = "top.yukonga.miuix.kmp", name = "miuix-nav-android", version.ref = "miuix-nav" }
miuix-blur-android = { group = "top.yukonga.miuix.kmp", name = "miuix-blur-android", version.ref = "miuix" }
miuix-ui-android = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference-android = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
opencc4j = { group = "com.github.houbb", name = "opencc4j", version.ref = "opencc4j" }
webp-imageio = { group = "com.github.usefulness", name = "webp-imageio", version.ref = "webp-imageio" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
