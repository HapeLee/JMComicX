# 用户可见版本。正式发布前手工修改这里。
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=2
# 0 = 正式版；1 = 预发布（CI 依据已有 tag 自动追加 -beta.N）。
# 内部构建编号不在此维护，由 Git 提交数派生，见 app/build.gradle.kts 顶部注释。
VERSION_SUFFIX=0
# versionCode = VERSION_CODE_BASE + 提交数。
# 历史编号是 2.8.x => 2xxxx（2.8.2 为 20802），偏移到 1000000 以上才覆盖得了已装的版本；
# 一经发布不可再改，否则升级链断掉。
VERSION_CODE_BASE=1000000
