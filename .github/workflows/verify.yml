name: Verify

# 日常校验：push / PR 只跑单测与 debug 构建，不产出 Release。
# 正式发布走 release.yml -> auto-release.yml。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode 取自提交数，浅克隆会算成 1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests and build debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --continue --console=plain

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports
          if-no-files-found: warn
          path: |
            core/build/test-results/test/**
            core/build/reports/tests/test/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
